replicaCount: 2

image:
  repository: ghcr.io/cavedoni/chaos-frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

podAnnotations:
  prometheus.io/scrape: "false"
